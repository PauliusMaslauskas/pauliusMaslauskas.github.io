<!DOCTYPE html>
<html lang="lt">
<head>
    <script>(function(){try{if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "Organization",
            "url": "https://glostoakis.lt/",
            "logo": "https://glostoakis.lt/img/logo-favicon-black.svg"
        }
    </script>
    <script src="https://cdn.counter.dev/script.js" data-id="87aa8b19-e0c6-4f12-97a2-59f511c6d7a5" data-utcoffset="3"></script>
    <link rel="stylesheet" href="css/home-styles.css">
    <link rel="icon" href="img/logo-favicon-black.svg" type="image/x-icon">
    <link rel="icon" href="https://glostoakis.lt/img/logo-favicon-black.svg" type="image/svg+xml">
    <link rel="alternate icon" href="/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="https://glostoakis.lt/img/logo-favicon-black.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>GLOSTO AKIS — Netrukus</title>
    <style>
        .soon {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 24px;
        }
        .soon img { height: 96px; }
        [data-theme="dark"] .soon img { filter: invert(1); }
        .soon h1 { letter-spacing: 4px; }
        .soon .tag {
            color: var(--mute);
            letter-spacing: 3px;
            text-transform: uppercase;
            font-size: 0.85em;
        }
        .soon p { max-width: 520px; }
        .soon .contact { margin-top: 20px; font-size: 0.9em; }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
        <span data-light>TAMSA</span>
        <span data-dark>ŠVIESA</span>
    </button>

    <section class="soon">
        <img src="img/logo-header-black.svg" alt="Glosto Akis" class="logo-group">
        <h1>GLOSTO AKIS</h1>
        <div class="tag">Netrukus · Coming soon</div>
        <p>Ruošiame kolekciją. Puslapis netrukus bus atidarytas.</p>
        <div class="contact">
            <p><a href="mailto:data@glostoakis.lt">data@glostoakis.lt</a></p>
        </div>
    </section>

    <script src="js/theme.js"></script>
</body>
</html>
